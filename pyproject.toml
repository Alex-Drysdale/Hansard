[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hansard-pipeline"
version = "0.2.0"
description = "Ingest UK Parliament debates, divisions and members into Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary,pool]>=3.2",
    "yoyo-migrations>=9.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
    # Retrieval and answering (Phase 3)
    "fastembed>=0.8",
    "lancedb>=0.38",
    "pyarrow>=25.0",
    "openai>=3.8",
    "fastapi>=0.141",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-postgresql>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hansard = "hansard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Warnings are errors: a DeprecationWarning in our own code is a bug we
    # want to fix now rather than discover on the next dependency bump.
    "error",
    # Except this one, which starlette raises while importing itself. Not ours
    # to fix, and narrowly scoped so it cannot hide a warning we care about.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 flag "ambiguous" Unicode. This project quotes Hansard verbatim,
# and Hansard uses typographic quotes and dashes, so the warning fires on
# correct data rather than on a mistake.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["hansard"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Neither ships type information. Declaring it here keeps the ignores in one
# place instead of scattered through the modules that import them.
[[tool.mypy.overrides]]
module = ["apscheduler.*", "yoyo.*", "pyarrow.*", "lancedb.*", "fastembed.*"]
ignore_missing_imports = true
